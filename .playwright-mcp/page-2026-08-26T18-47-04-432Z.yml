  - region [ref=f3e114]:
    - heading "Os padrões obrigatórios" [level=2] [ref=f3e116]
    - paragraph [ref=f3e117]: Cada um destes existe porque a saga falha de um jeito específico sem ele. O botão roda o cenário que expõe exatamente essa falha — e abre o inspetor onde ela aparece.
    - generic [ref=f3e118]:
      - article [ref=f3e119]:
        - heading "Transactional Outbox" [level=3] [ref=f3e120]
        - paragraph [ref=f3e121]: Gravar no Postgres e publicar no Kafka são dois sistemas. Um crash no meio deixa pedido sem evento — ou evento sem pedido.
        - paragraph [ref=f3e122]:
          - text: O evento é gravado na tabela
          - code [ref=f3e123]: outbox
          - strong [ref=f3e124]: na mesma transação
          - text: do efeito de negócio. Um relay assíncrono lê
          - code [ref=f3e125]: WHERE published_at IS NULL
          - text: com
          - code [ref=f3e126]: FOR UPDATE SKIP LOCKED
          - text: ", publica e marca a linha."
        - paragraph [ref=f3e127]:
          - text: "O preço: o relay pode publicar e morrer antes de marcar, republicando na volta. Por isso outbox e idempotência são um"
          - strong [ref=f3e128]: par
          - text: — usar só um dá falsa segurança.
        - button "Ver o outbox esvaziando" [ref=f3e129] [cursor=pointer]
      - article [ref=f3e130]:
        - heading "Inbox de idempotência" [level=3] [ref=f3e131]
        - paragraph [ref=f3e132]: Entrega at-least-once num serviço de pagamento significa cobrar duas vezes.
        - paragraph [ref=f3e133]:
          - code [ref=f3e134]: processed_messages (event_id, consumer_group)
          - text: com PK composta. O insert acontece na mesma transação do efeito; violação de PK significa "já processei" → rollback, commita o offset, segue.
        - paragraph [ref=f3e135]:
          - text: "A chave é composta de propósito:"
          - strong [ref=f3e136]: consumer groups distintos precisam processar o mesmo evento
          - text: . Usar só
          - code [ref=f3e137]: event_id
          - text: faz o segundo consumidor ignorar tudo em silêncio.
        - button "Entregar o mesmo evento 2×" [ref=f3e138] [cursor=pointer]
      - article [ref=f3e139]:
        - heading "Retry escalonado + DLT" [level=3] [ref=f3e140]
        - paragraph [ref=f3e141]: Kafka não tem DLQ. Retryar na própria partição trava todos os outros pedidos que caíram nela.
        - paragraph [ref=f3e142]:
          - text: Erro é
          - strong [ref=f3e143]: classificado antes
          - text: "de retryar: transitório sobe a escada"
          - code [ref=f3e144]: retry-5s → retry-1m → retry-10m
          - text: ; permanente vai
          - strong [ref=f3e145]: direto para a DLT
          - text: ", sem queimar 11 minutos no que nunca vai funcionar."
        - paragraph [ref=f3e146]:
          - text: "O preço é sério: desviada para o retry, a mensagem pode ser processada"
          - strong [ref=f3e147]: depois
          - text: da seguinte do mesmo pedido. A ordenação daquele pedido morre ali.
        - button "Subir a escada de retry" [ref=f3e148] [cursor=pointer]
      - article [ref=f3e149]:
        - heading "orderId como chave de partição" [level=3] [ref=f3e150]
        - paragraph [ref=f3e151]: "Sem chave, o produtor distribui em round-robin: o estorno pode ser processado antes da aprovação."
        - paragraph [ref=f3e152]:
          - text: A chave de toda mensagem é o
          - code [ref=f3e153]: orderId
          - text: . Todos os eventos de um pedido caem na mesma partição, logo são ordenados entre si. Entre pedidos diferentes, ordem é irrelevante.
        - paragraph [ref=f3e154]:
          - text: Mas a garantia vale
          - strong [ref=f3e155]: por tópico
          - text: . O Order consome três tópicos e pode ver
          - code [ref=f3e156]: stock.reserved
          - text: antes de
          - code [ref=f3e157]: payment.approved
          - text: . Nenhuma chave resolve isso — só a máquina de estados monotônica.
        - button "Ver partição e offsets" [ref=f3e158] [cursor=pointer]
      - article [ref=f3e159]:
        - heading "Compensação" [level=3] [ref=f3e160]
        - paragraph [ref=f3e161]: O envio falhou, mas o pagamento já foi autorizado e o estoque já foi reservado. Alguém precisa desfazer.
        - paragraph [ref=f3e162]:
          - text: Em coreografia não há quem mande desfazer. O Payment assina
          - code [ref=f3e163]: ecommerce.shipping.v1
          - text: e estorna por conta própria; o Inventory assina o mesmo tópico e libera o estoque.
          - strong [ref=f3e164]: Compensação dupla e paralela.
        - paragraph [ref=f3e165]:
          - text: "Repare no acoplamento: o Payment precisa conhecer as falhas de"
          - strong [ref=f3e166]: todos
          - text: os passos posteriores. Acrescentar uma 5ª etapa obriga a mexer em todos os serviços anteriores.
        - button "Forçar compensação dupla" [ref=f3e167] [cursor=pointer]
      - article [ref=f3e168]:
        - heading "Fail secure" [level=3] [ref=f3e169]
        - paragraph [ref=f3e170]:
          - text: Um
          - code [ref=f3e171]: catch
          - text: que libera estoque ou aprova pagamento "porque deu erro" é o pior bug possível.
        - paragraph [ref=f3e172]:
          - text: Erro desconhecido
          - strong [ref=f3e173]: não commita o offset
          - text: . A mensagem volta, sobe a escada e termina na DLT. Estado indeterminado nunca vira estado favorável ao cliente.
        - paragraph [ref=f3e174]: "O efeito colateral: a DLT acumula. Sem ferramenta de reprocessamento ela vira cemitério — ninguém abre um tópico com 4 mil mensagens sem CLI."
        - button "Enviar evento inválido" [ref=f3e175] [cursor=pointer]

# =============================================================================
# Infraestrutura de desenvolvimento local.
#
# Escolhas deliberadas:
# - Kafka em modo KRaft (sem Zookeeper) e com auto-criação de tópico DESLIGADA:
#   tópico que nasce por acidente de typo é bug silencioso (A02).
# - CINCO Postgres separados, com usuário e senha próprios. Um Postgres só com cinco
#   databases seria mais leve, mas um serviço conseguiria ler as tabelas do outro — e o
#   isolamento de dados é justamente a razão de existir da SAGA. O custo de RAM aqui é
#   didático, não acidental.
# - Credenciais fixas e óbvias: isto é ambiente local descartável. Em Kubernetes tudo
#   isto vem de Secret (Sealed Secrets/SOPS), nunca de arquivo versionado.
# =============================================================================

name: ecommerce-saga

x-postgres-common: &postgres-common
  image: postgres:17-alpine
  restart: unless-stopped
  command: >
    postgres
    -c shared_buffers=64MB
    -c max_connections=50
    -c log_min_duration_statement=500ms
  healthcheck:
    test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
    interval: 5s
    timeout: 5s
    retries: 10
  networks: [saga]

services:
  # ---------------------------------------------------------------- broker ---
  kafka:
    image: apache/kafka:3.9.0
    container_name: ecommerce-kafka
    restart: unless-stopped
    ports:
      - '29092:29092' # acesso do host
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://kafka:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Cluster de um nó: nada pode pedir mais de uma réplica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      # Rebalance instantâneo em dev; em produção este delay evita tempestade a cada deploy.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Tópico só existe se o script criar. Typo em nome de tópico deve FALHAR, não criar lixo.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks: [saga]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ecommerce-kafka-ui
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy
    networks: [saga]

  # ------------------------------------------------------------- databases ---
  # As portas de host usam a faixa 154xx (e 1x0xx no Mailhog) em vez das padrão.
  # Motivo: 5432 e 8025 já estavam ocupadas por outros projetos desta máquina, e o
  # Compose falha o bind em silêncio — o container sobe, a porta não publica, e você
  # perde meia hora achando que é problema de rede. Faixa própria evita a colisão.
  # Dentro da rede `saga` os serviços continuam falando na porta padrão 5432.
  postgres-order:
    <<: *postgres-common
    container_name: ecommerce-pg-order
    ports: ['15432:5432']
    environment:
      POSTGRES_USER: order_svc
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: order_db
    volumes: [pg-order:/var/lib/postgresql/data]

  postgres-payment:
    <<: *postgres-common
    container_name: ecommerce-pg-payment
    ports: ['15433:5432']
    environment:
      POSTGRES_USER: payment_svc
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: payment_db
    volumes: [pg-payment:/var/lib/postgresql/data]

  postgres-inventory:
    <<: *postgres-common
    container_name: ecommerce-pg-inventory
    ports: ['15434:5432']
    environment:
      POSTGRES_USER: inventory_svc
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: inventory_db
    volumes: [pg-inventory:/var/lib/postgresql/data]

  postgres-shipping:
    <<: *postgres-common
    container_name: ecommerce-pg-shipping
    ports: ['15435:5432']
    environment:
      POSTGRES_USER: shipping_svc
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: shipping_db
    volumes: [pg-shipping:/var/lib/postgresql/data]

  postgres-notification:
    <<: *postgres-common
    container_name: ecommerce-pg-notification
    ports: ['15436:5432']
    environment:
      POSTGRES_USER: notification_svc
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: notification_db
    volumes: [pg-notification:/var/lib/postgresql/data]

  # --------------------------------------------------------- observabilidade ---
  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    container_name: ecommerce-jaeger
    restart: unless-stopped
    ports:
      - '16686:16686' # UI
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    networks: [saga]

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: ecommerce-prometheus
    restart: unless-stopped
    ports: ['9090:9090']
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      # Retenção curta: em dev não interessa histórico, interessa não comer disco.
      - '--storage.tsdb.retention.time=6h'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [saga]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ecommerce-grafana
    restart: unless-stopped
    ports: ['3300:3000']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [saga]

  # -------------------------------------------------------------- utilitários ---
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ecommerce-mailhog
    restart: unless-stopped
    ports:
      - '11025:1025' # SMTP
      - '18025:8025' # UI
    networks: [saga]

  # structurizr/lite foi descontinuado em favor da ferramenta consolidada.
  structurizr:
    image: structurizr/structurizr:latest
    container_name: ecommerce-structurizr
    command: local
    restart: unless-stopped
    ports: ['8081:8080']
    volumes:
      - ../../docs/architecture:/usr/local/structurizr
    networks: [saga]

networks:
  saga:
    driver: bridge

volumes:
  kafka-data:
  pg-order:
  pg-payment:
  pg-inventory:
  pg-shipping:
  pg-notification:
  grafana-data:

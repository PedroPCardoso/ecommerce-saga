global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Os serviços expõem /metrics a partir da Fase 7. Enquanto não existirem,
  # estes targets ficam DOWN — o que é o esperado, não um defeito.
  - job_name: ecommerce-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'host.docker.internal:3000'
          - 'host.docker.internal:3001'
          - 'host.docker.internal:3002'
          - 'host.docker.internal:3003'
          - 'host.docker.internal:3004'
        labels:
          env: local

apiVersion: v1
kind: ServiceAccount
metadata: { name: notification-service, namespace: ecommerce-saga }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: notification-service-config, namespace: ecommerce-saga }
data:
  NODE_ENV: production
  NOTIFICATION_SERVICE_PORT: '3004'
  KAFKA_BROKERS: saga-kafka-kafka-bootstrap:9092
  KAFKA_CLIENT_ID_PREFIX: ecommerce
  # Mailhog está FORA do escopo desta rodada de Kubernetes (não faz parte dos
  # "5 serviços de negócio" do plano) — SMTP fica apontado para um host que
  # não existe no cluster. O envio de e-mail vai falhar, mas isso NÃO bloqueia
  # a saga: order/payment/inventory/shipping não dependem do sucesso do envio
  # de e-mail para o pedido chegar a CONFIRMED.
  SMTP_HOST: mailhog.not-deployed.invalid
  SMTP_PORT: '1025'
  SMTP_FROM: no-reply@example.com
---
apiVersion: v1
kind: Secret
metadata: { name: notification-service-secrets, namespace: ecommerce-saga }
type: Opaque
stringData:
  # Valores FICTÍCIOS, iguais ao .env.example — troque antes de qualquer uso real.
  NOTIFICATION_DATABASE_URL: postgresql://notification_svc:changeme@saga-postgres-rw:5432/notification_db?schema=public
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notification-service, namespace: ecommerce-saga }
spec:
  replicas: 2
  selector: { matchLabels: { app: notification-service } }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata: { labels: { app: notification-service } }
    spec:
      serviceAccountName: notification-service
      terminationGracePeriodSeconds: 45
      containers:
        - name: notification-service
          image: ecommerce-saga-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3004 }]
          envFrom:
            - configMapRef: { name: notification-service-config }
            - secretRef: { name: notification-service-secrets }
          lifecycle:
            preStop:
              exec: { command: ['sh', '-c', 'sleep 5'] }
          startupProbe:
            httpGet: { path: /health/startup, port: 3004 }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /health/ready, port: 3004 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: 3004 }
            periodSeconds: 10
          resources:
            requests: { memory: 128Mi, cpu: '100m' }
            limits: { memory: 256Mi, cpu: '250m' }
---
apiVersion: v1
kind: Service
metadata: { name: notification-service, namespace: ecommerce-saga }
spec:
  selector: { app: notification-service }
  ports: [{ port: 3004, targetPort: 3004 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: notification-service, namespace: ecommerce-saga }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: notification-service } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: notification-service, namespace: ecommerce-saga }
spec:
  podSelector: { matchLabels: { app: notification-service } }
  policyTypes: [Ingress, Egress]
  ingress: [] # não recebe tráfego externo — só o Kafka aciona (e o pod é quem PUXA do Kafka, não o inverso)
  egress:
    - to: [] # Kafka e Postgres são outros pods do MESMO namespace — sem seletor, permite tudo dentro; troque por matchLabels do saga-kafka/saga-postgres para trancar mais
